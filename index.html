<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Builder App - Developed by Raj</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/react.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/react-dom.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.26.0/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }
        
        .developer-credit {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
            font-style: italic;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        .content {
            padding: 30px;
        }
        
        .template-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }
        
        .template-card {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            background: #f9f9f9;
        }
        
        .template-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
            transform: translateY(-4px);
        }
        
        .template-card h3 {
            font-size: 18px;
            color: #333;
            margin-bottom: 8px;
        }
        
        .template-card p {
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
        }
        
        .template-preview {
            background: white;
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
            color: #999;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 20px;
        }
        
        .form-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .form-section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .form-group label {
            font-size: 13px;
            font-weight: 500;
            color: #333;
        }
        
        input[type="text"],
        input[type="email"],
        textarea,
        select {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        
        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: white;
            border: 1px solid #ddd;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #f5f5f5;
            border-color: #667eea;
        }
        
        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }
        
        .btn-add {
            background: #f0f0f0;
            color: #667eea;
            border: 1px solid #ddd;
            margin-top: 8px;
        }
        
        .btn-add:hover {
            background: #f667eea20;
        }
        
        .preview-section {
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            background: #fafafa;
            max-height: 600px;
            overflow-y: auto;
        }
        
        #resume-preview {
            background: white;
            padding: 30px;
            font-family: 'Georgia', serif;
            line-height: 1.6;
            color: #333;
            border-radius: 6px;
        }
        
        .resume-header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
        }
        
        .resume-header h1 {
            font-size: 28px;
            margin: 0 0 5px 0;
            font-weight: bold;
        }
        
        .resume-header p {
            font-size: 12px;
            color: #666;
            margin: 0;
        }
        
        .resume-section {
            margin-bottom: 20px;
        }
        
        .resume-section h2 {
            font-size: 14px;
            font-weight: bold;
            margin: 15px 0 8px 0;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
        }
        
        .resume-item {
            margin-bottom: 10px;
            font-size: 12px;
        }
        
        .resume-item-title {
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
        
        .resume-item-subtitle {
            color: #666;
            font-size: 11px;
            margin-bottom: 3px;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            justify-content: center;
        }
        
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .step {
            font-size: 12px;
            font-weight: 500;
            color: #999;
            padding: 8px 16px;
            border-radius: 20px;
            background: #f0f0f0;
        }
        
        .step.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .item-card {
            border: 1px solid #e0e0e0;
            background: #f9f9f9;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        
        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .template-grid {
                grid-template-columns: 1fr;
            }
            
            .input-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState } = React;

        function ResumeBuilder() {
            const [step, setStep] = useState('template');
            const [selectedTemplate, setSelectedTemplate] = useState(null);
            const [formData, setFormData] = useState({
                fullName: 'RAJBAHADUR',
                email: 'Kumar.raj9435@gmail.com',
                phone: '+91-8826655562',
                location: 'North East Delhi, Delhi-110094',
                about: '',
                experience: [
                    { title: 'E-commerce Executive', company: 'Genuine Innovations Private Limited', period: 'June 2024 - Present', details: 'Managed product listings across 8+ platforms' }
                ],
                education: [
                    { degree: 'B.Com (Programme)', institution: 'Delhi University', year: '2023' },
                    { degree: 'BCA (2nd Year)', institution: 'IGNOU', year: 'Pursuing' }
                ],
                skills: 'E-commerce Operations, Amazon, Flipkart, Myntra, Unicommerce, Advanced Excel'
            });

            const templates = [
                { id: 'modern', name: 'Modern', description: 'Clean & contemporary', preview: 'Modern Design' },
                { id: 'professional', name: 'Professional', description: 'Corporate style', preview: 'Professional Design' },
                { id: 'creative', name: 'Creative', description: 'Bold & colorful', preview: 'Creative Design' }
            ];

            const handleInputChange = (field, value) => {
                setFormData(prev => ({ ...prev, [field]: value }));
            };

            const handleExperienceChange = (index, field, value) => {
                const newExperience = [...formData.experience];
                newExperience[index][field] = value;
                setFormData(prev => ({ ...prev, experience: newExperience }));
            };

            const handleEducationChange = (index, field, value) => {
                const newEducation = [...formData.education];
                newEducation[index][field] = value;
                setFormData(prev => ({ ...prev, education: newEducation }));
            };

            const addExperience = () => {
                setFormData(prev => ({
                    ...prev,
                    experience: [...prev.experience, { title: '', company: '', period: '', details: '' }]
                }));
            };

            const addEducation = () => {
                setFormData(prev => ({
                    ...prev,
                    education: [...prev.education, { degree: '', institution: '', year: '' }]
                }));
            };

            const downloadPDF = () => {
                const element = document.getElementById('resume-preview');
                const opt = {
                    margin: 8,
                    filename: `${formData.fullName}_Resume.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2 },
                    jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
                };
                html2pdf().set(opt).from(element).save();
            };

            return (
                <>
                    <div className="header">
                        <h1>📄 Resume Builder App</h1>
                        <p>Create your professional resume in minutes</p>
                        <div className="developer-credit">Developed by Raj | E-commerce Professional</div>
                    </div>

                    <div className="container">
                        <div className="content">
                            {step === 'template' && (
                                <>
                                    <div className="step-indicator">
                                        <div className="step active">Step 1: Choose Template</div>
                                        <div className="step">Step 2: Fill Details</div>
                                        <div className="step">Step 3: Download</div>
                                    </div>
                                    <h2 style={{marginBottom: '20px', color: '#333'}}>Select Your Resume Template</h2>
                                    <div className="template-grid">
                                        {templates.map(template => (
                                            <div
                                                key={template.id}
                                                className="template-card"
                                                onClick={() => {
                                                    setSelectedTemplate(template.id);
                                                    setStep('fill');
                                                }}
                                            >
                                                <h3>{template.name}</h3>
                                                <p>{template.description}</p>
                                                <div className="template-preview">{template.preview}</div>
                                            </div>
                                        ))}
                                    </div>
                                </>
                            )}

                            {step === 'fill' && (
                                <>
                                    <div className="step-indicator">
                                        <div className="step">Step 1: Choose Template</div>
                                        <div className="step active">Step 2: Fill Details</div>
                                        <div className="step">Step 3: Download</div>
                                    </div>
                                    <div className="form-grid">
                                        <div className="form-section">
                                            <h2>Personal Information</h2>
                                            <div className="form-group">
                                                <label>Full Name</label>
                                                <input type="text" value={formData.fullName} onChange={(e) => handleInputChange('fullName', e.target.value)} />
                                            </div>
                                            <div className="form-group">
                                                <label>Email</label>
                                                <input type="email" value={formData.email} onChange={(e) => handleInputChange('email', e.target.value)} />
                                            </div>
                                            <div className="form-group">
                                                <label>Phone</label>
                                                <input type="text" value={formData.phone} onChange={(e) => handleInputChange('phone', e.target.value)} />
                                            </div>
                                            <div className="form-group">
                                                <label>Location</label>
                                                <input type="text" value={formData.location} onChange={(e) => handleInputChange('location', e.target.value)} />
                                            </div>
                                            <div className="form-group">
                                                <label>Professional Summary</label>
                                                <textarea value={formData.about} onChange={(e) => handleInputChange('about', e.target.value)} placeholder="Describe your professional background..." />
                                            </div>

                                            <h2 style={{marginTop: '20px'}}>Experience</h2>
                                            {formData.experience.map((exp, idx) => (
                                                <div key={idx} className="item-card">
                                                    <div className="input-row">
                                                        <input type="text" placeholder="Job Title" value={exp.title} onChange={(e) => handleExperienceChange(idx, 'title', e.target.value)} />
                                                        <input type="text" placeholder="Company" value={exp.company} onChange={(e) => handleExperienceChange(idx, 'company', e.target.value)} />
                                                    </div>
                                                    <div style={{marginTop: '8px'}}>
                                                        <input type="text" placeholder="Period (e.g., June 2024 - Present)" value={exp.period} onChange={(e) => handleExperienceChange(idx, 'period', e.target.value)} style={{width: '100%'}} />
                                                    </div>
                                                    <div style={{marginTop: '8px'}}>
                                                        <textarea placeholder="Key responsibilities & achievements" value={exp.details} onChange={(e) => handleExperienceChange(idx, 'details', e.target.value)} style={{minHeight: '60px'}} />
                                                    </div>
                                                </div>
                                            ))}
                                            <button className="btn btn-add" onClick={addExperience}>+ Add Experience</button>

                                            <h2 style={{marginTop: '20px'}}>Education</h2>
                                            {formData.education.map((edu, idx) => (
                                                <div key={idx} className="item-card">
                                                    <div className="input-row">
                                                        <input type="text" placeholder="Degree" value={edu.degree} onChange={(e) => handleEducationChange(idx, 'degree', e.target.value)} />
                                                        <input type="text" placeholder="Year" value={edu.year} onChange={(e) => handleEducationChange(idx, 'year', e.target.value)} />
                                                    </div>
                                                    <div style={{marginTop: '8px'}}>
                                                        <input type="text" placeholder="Institution" value={edu.institution} onChange={(e) => handleEducationChange(idx, 'institution', e.target.value)} style={{width: '100%'}} />
                                                    </div>
                                                </div>
                                            ))}
                                            <button className="btn btn-add" onClick={addEducation}>+ Add Education</button>

                                            <h2 style={{marginTop: '20px'}}>Skills</h2>
                                            <textarea value={formData.skills} onChange={(e) => handleInputChange('skills', e.target.value)} placeholder="Enter skills separated by commas..." />
                                        </div>

                                        <div>
                                            <h2 style={{marginBottom: '16px'}}>Resume Preview</h2>
                                            <div className="preview-section">
                                                <div id="resume-preview">
                                                    <div className="resume-header">
                                                        <h1>{formData.fullName}</h1>
                                                        <p>{formData.email} | {formData.phone} | {formData.location}</p>
                                                    </div>

                                                    {formData.about && (
                                                        <div className="resume-section">
                                                            <h2>PROFESSIONAL SUMMARY</h2>
                                                            <p style={{fontSize: '12px', margin: 0}}>{formData.about}</p>
                                                        </div>
                                                    )}

                                                    <div className="resume-section">
                                                        <h2>EXPERIENCE</h2>
                                                        {formData.experience.map((exp, idx) => (
                                                            <div key={idx} className="resume-item">
                                                                <div className="resume-item-title">
                                                                    <span>{exp.title || 'Job Title'}</span>
                                                                    <span>{exp.period || 'Period'}</span>
                                                                </div>
                                                                <div className="resume-item-subtitle">{exp.company || 'Company'}</div>
                                                                {exp.details && <p style={{fontSize: '11px', margin: '3px 0 0 0'}}>• {exp.details}</p>}
                                                            </div>
                                                        ))}
                                                    </div>

                                                    <div className="resume-section">
                                                        <h2>EDUCATION</h2>
                                                        {formData.education.map((edu, idx) => (
                                                            <div key={idx} className="resume-item">
                                                                <div className="resume-item-title">
                                                                    <span>{edu.degree || 'Degree'}</span>
                                                                    <span>{edu.year || 'Year'}</span>
                                                                </div>
                                                                <div className="resume-item-subtitle">{edu.institution || 'Institution'}</div>
                                                            </div>
                                                        ))}
                                                    </div>

                                                    {formData.skills && (
                                                        <div className="resume-section">
                                                            <h2>SKILLS</h2>
                                                            <p style={{fontSize: '12px', margin: 0}}>{formData.skills}</p>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </>
                            )}

                            <div className="button-group">
                                {step === 'fill' && (
                                    <>
                                        <button className="btn btn-secondary" onClick={() => setStep('template')}>← Back</button>
                                        <button className="btn btn-primary" onClick={downloadPDF}>⬇️ Download PDF</button>
                                    </>
                                )}
                            </div>
                        </div>
                    </div>
                </>
            );
        }

        ReactDOM.render(<ResumeBuilder />, document.getElementById('root'));
    </script>
</body>
</html>
